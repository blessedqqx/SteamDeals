function chart(h){

const SALES=[["2026-12-17","sWin"],["2027-03-18","sSpr"],["2027-06-24","sSum"],["2027-10-01","sAut"]]; // крупные распродажи Steam, обновляйте даты раз в год

function analyze(g,h){

 return{span:(end-pts[0][0])/day,best,eps,share:tot?atl/tot:0};
}
