name: post-telegram
on:
  schedule:
    - cron: "20 7,10,13,16,19 * * *"   # 5 запусков в сутки (07:20, 10:20, 13:20, 16:20, 19:20 по UTC), в каждом по одному посту
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post-telegram
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/post_telegram.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          SITE_URL: ${{ vars.SITE_URL }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data/posted.json && git commit -m "posted" || exit 0
          git pull --rebase origin main && git push
