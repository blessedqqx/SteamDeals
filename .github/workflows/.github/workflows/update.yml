name: update-prices
on:
  schedule: [{cron: "0 5 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/discover.py
        continue-on-error: true
      - run: python scripts/collect.py
      - run: python scripts/reviews.py
        continue-on-error: true
      - run: python scripts/post_telegram.py
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          SITE_URL: ${{ vars.SITE_URL }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data && git commit -m "data" || exit 0
          git push
